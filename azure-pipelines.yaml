trigger:
  branches:
    include:
      - prod

pr:
  branches:
    include:
      - prod

pool:
  vmImage: ubuntu-24.04

variables:
  buildConfiguration: Release
  packageProject: bleak.Api.Rest/bleak.Api.Rest.csproj
  solution: bleak.Api.sln

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Use .NET SDK 8.x
    inputs:
      packageType: sdk
      version: 8.0.x

  - bash: |
      VERSION_PREFIX=$(cat version.txt)
      PACKAGE_VERSION="${VERSION_PREFIX}.$(Build.BuildId)"
      echo "##vso[task.setvariable variable=PackageVersion]${PACKAGE_VERSION}"
    displayName: Set package version

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: $(solution)

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: $(solution)
      arguments: --configuration $(buildConfiguration) --no-restore

  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: $(solution)
      arguments: --configuration $(buildConfiguration) --no-build --logger trx
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: Pack bleak.Api.Rest
    inputs:
      command: pack
      packagesToPack: $(packageProject)
      nobuild: true
      versioningScheme: byEnvVar
      versionEnvVar: PackageVersion
      arguments: --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)

  - task: PublishBuildArtifacts@1
    displayName: Publish package artifact
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: packages

  - task: NuGetCommand@2
    displayName: Push package to NuGet
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/prod'))
    inputs:
      command: push
      nuGetFeedType: external
      publishFeedCredentials: NuGetConnection
      packagesToPush: $(Build.ArtifactStagingDirectory)/**/*.nupkg
